name: CI
# Qualification topology: docs/development/QUALIFICATION-MATRIX.md

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Audit architecture contract
        run: python scripts/audit_architecture_contract.py

      - name: Qualify repository
        run: python scripts/qualify_repository.py

      - name: Qualify A003 familiarity benchmark
        run: python scripts/run_familiarity_benchmark_a003.py --qualify

      - name: Qualify A008 procedural memory
        run: python scripts/qualify_procedural_memory_a008.py

      - name: Qualify A009 integrated cognitive loop
        run: python scripts/qualify_integrated_loop_a009.py

      - name: Qualify A010 dense non-selective baseline
        run: python scripts/qualify_baseline_comparison_a010.py

      - name: Qualify A011 portable system
        run: python scripts/qualify_asca_v0x_a011.py --expected-source-sha "$(git rev-parse HEAD)" --output-dir "$RUNNER_TEMP/a011-portable-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Upload A011 portable qualification pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a011-portable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a011-portable-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
