name: CI
# Qualification topology: docs/development/QUALIFICATION-MATRIX.md

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Audit architecture contract
        run: python scripts/audit_architecture_contract.py

      - name: Qualify repository
        run: python scripts/qualify_repository.py

      - name: Qualify A003 familiarity benchmark
        run: python scripts/run_familiarity_benchmark_a003.py --qualify

      - name: Qualify A008 procedural memory
        run: python scripts/qualify_procedural_memory_a008.py

      - name: Qualify A009 integrated cognitive loop
        run: python scripts/qualify_integrated_loop_a009.py

      - name: Qualify A010 dense non-selective baseline
        run: python scripts/qualify_baseline_comparison_a010.py

      - name: Preserve A011 frozen v0.x source anchors
        run: python scripts/verify_a011_frozen_profile_preservation.py

      - name: Qualify A012 relational reasoning
        run: python scripts/qualify_relational_reasoning_a012.py --output "$RUNNER_TEMP/a012-relational-${{ github.run_id }}-${{ github.run_attempt }}.json"

      - name: Upload A012 portable qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a012-relational-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a012-relational-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error

      - name: Qualify A013 selective relational activation
        run: python scripts/qualify_relational_activation_a013.py --output "$RUNNER_TEMP/a013-relational-activation-${{ github.run_id }}-${{ github.run_attempt }}.json"

      - name: Upload A013 portable qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a013-relational-activation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a013-relational-activation-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error

      - name: Qualify A014 structural need routing
        run: python scripts/qualify_structural_routing_a014.py --output "$RUNNER_TEMP/a014-structural-routing-${{ github.run_id }}-${{ github.run_attempt }}.json"

      - name: Upload A014 portable structural routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a014-structural-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a014-structural-routing-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
      - name: Verify committed A014 physical structural routing evidence
        run: python scripts/verify_a014_physical_evidence.py docs/development/qualification/a014-structural-routing-physical-v1.json
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD