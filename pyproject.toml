[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "FlyWireASCA"
version = "0.1.0.dev0"
description = "Research and engineering for Associative Selective Cognition Architecture (ASCA)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "funggier" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
